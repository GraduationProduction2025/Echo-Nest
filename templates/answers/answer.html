{% extends 'base.html' %}

{% block base %}
{{ title }}
{% endblock base %}

{% block content %}
{% load static %}

<div class="container">
    <div class="title-bar">
        <h1>{{ title }}</h1>
    </div>
    <form action="/complete/" method="post">
        {% csrf_token %}
        <!-- Survey_idをキーとするQuestionをすべて取り出す -->
        {% for q in question %}
        <p>{{ q.title }}</p>
        <input type={{q.type}} name="{{q.id}}"></br>
        {% empty %}
        <p>質問はありません</p>
        {% endfor %}
        <input type="submit" value="送信する">
    </form>
</div>
{% endblock content %}
