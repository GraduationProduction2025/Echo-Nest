{% extends 'base.html' %}

{% block base %}
{{ title }}
{% endblock base %}

{% block content %}
{% load static %}
<form method="POST">
    {% csrf_token %}
    <div class="container">
        <div class="title-bar">
            <h1>{{ title }}</h1>
            <input type="text" name="title-text" class="title-text" placeholder="タイトル">
            <div class="publish-container">
                <!-- 公開期間ラベルとプルダウンリスト -->
                <label for="publish-for_publish" class="publish-label">公開期間</label>
                <select id="publish-for_publish" class="publish-select">
                    <option value="unlimited">無期限</option>
                    <option value="limited">有期限</option>
                </select>
        
                <!-- 日時入力フォーム -->
                <div id="publish-datetime-form" class="publish-datetime-form">
                    <label for="publish-date" class="publish-label">終了日時:</label>
                    <input type="datetime-local" id="publish-date" class="publish-input" name="publish_date">
                </div>
            </div>
        </div>
    </div>

    <!-- 質問の新規追加 -->
    <div class="add-ques">
        <!-- 新しい質問を入れるdiv -->
        <div id="inputFields"></div>
        <button class="add-ques-btn" id="input-cre" onclick="createInputField(event,'text')">＋ 新規追加</button>
    </div>

    <div class="submit-container">
        <!-- 質問を作成 -->
        <div class="create-ques">
            <button type="submit" class="create-ques-btn" id="create-ques-btn" name="action" value="create">公開</button>
            <button type="submit" class="tem-ques-btn" id="tem-ques-btn" name="action" value="tem">一時保存</button>
            <button type="button" class="cancel-ques-btn" onclick="history.back()">キャンセル</button>
        </div>
    </div>
</form>

{% endblock content %}
