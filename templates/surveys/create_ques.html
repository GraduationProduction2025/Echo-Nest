{% extends 'base.html' %}

{% block base %}
{{ title }}
{% endblock base %}

{% block content %}
{% load static %}
<form method="POST">
    {% csrf_token %}

    <div class="container">
        <div class="title-bar">
            <h1>{{ title }}</h1>
        </div>
        <input type="text" name="title-text" class="title-text" placeholder="タイトル">
    </div>

    <!-- 質問の新規追加 -->
    <div class="add-ques">
        <!-- 新しい質問を入れるdiv -->
        <div id="inputFields"></div>

        <button class="add-ques-btn" id="input-cre" onclick="showInputOptions(event)">＋ 新規追加</button>

        <!-- 新規追加ボタンを押すと出現 -->
        <!-- 質問のタイプを選択 -->
        <div id="inputOptions">
            <input type="button" class="input-option" value="テキスト" onclick="createInputField(event,'text')">
            <input type="button" class="input-option" value="チェックボックス" onclick="createInputField(event,'checkbox')">
        </div>
    </div>

    <div class="submit-container">
        <!-- 質問を作成 -->
        <div class="create-ques">
            <button type="submit" class="create-ques-btn" id="create-ques-btn" name="action" value="create">質問を作成</button>
            <button type="button" class="cancel-ques-btn" onclick=location.href="{% url 'templates:list' %}">キャンセル</button>
        </div>
    </div>
    </form>

{% endblock content %}
