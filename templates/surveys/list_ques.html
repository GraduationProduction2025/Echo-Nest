{% extends 'base.html' %}

{% block base %}
{{ title }}
{% endblock base %}

{% block content %}
<div class="container">
    <div class="title-bar">
        <h1>{{ title }}</h1>
    </div>

    <form method="get">
        <input type="search" 
               name="query" 
               value="{{ request.GET.query }}"
               placeholder="キーワードを入力">
    </form>

    <div class="scrollable-table">
        <table class="listtable">
            {% if val %}
                {% for i in val %}
                <tr>
                    <td>
                        <a href="{% url 'templates:answer' i.id %}" target="_blank">
                            {{ i.title }}
                        </a>
                    </td>
                    <td>{{ i.create_at|date:"Y-m-d H:i" }}</td>
                    <td>
                        <a href="{% url 'templates:ag_data' i.id %}">
                            詳細を見る
                        </a>
                    </td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3" class="no-results">
                        該当するアンケートがありませんでした。
                    </td>
                </tr>
            {% endif %}
        </table>
    </div>
    
    <div class="add-button">
        <button onclick="location.href='{% url 'templates:create_ques' %}'">
            新規作成
        </button>
        <button onclick="location.href='{% url 'templates:al_list' %}'">
            アンケート一覧
        </button>
        <button onclick="location.href='{% url 'templates:tem_list' %}'">
            下書き一覧
        </button>
    </div>
</div>
{% endblock content %}
