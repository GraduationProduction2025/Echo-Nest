<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block base %}
        {% endblock base %}
    </title>
    {% load static %}
    <script src="{% static 'js/common.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="appname" onclick=location.href="{% url 'templates:list_ques' %}">EchoNest</h1>
            <svg class="cloud-shape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100" preserveAspectRatio="none">
                <path fill="white" d="M0,50 C150,100 350,0 500,50 C650,100 800,20 1000,60 C1200,100 1400,40 1440,50 L1440,100 L0,100 Z"></path>
            </svg>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- 残りのコードは変更なし -->
    <nav class="side-menu">
        <ul class="menu-items">
            <li><a href="{% url 'templates:list_ques' %}">ホーム</a></li>
            <li><a href="{% url 'templates:al_list' %}">アンケート一覧</a></li>
            <li><a href="{% url 'templates:tem_list' %}">下書きアンケート</a></li>
            <li>お問い合わせ</li>
        </ul>
    </nav>

    <div class="overlay"></div>

    <div class="content">
        {% block content %}
        {% endblock content %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const sideMenu = document.querySelector('.side-menu');
            const overlay = document.querySelector('.overlay');

            function toggleMenu() {
                hamburger.classList.toggle('active');
                sideMenu.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            hamburger.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sideMenu.classList.contains('active')) {
                    toggleMenu();
                }
            });
        });
    </script>
</body>
</html>
